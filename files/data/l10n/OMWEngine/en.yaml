Subtitles: "Subtitles"
SunlightScattering: "Sunlight Scattering"
ShadowSoftShadows: "Soft Shadows"
ShadowSoftShadowsTooltip: "Smooth shadow edges. Decreases performance slightly but allows you to use a lower Shadow Map Resolution to compensate."
ShadowNightShadows: "Night Shadows"
ShadowWeatherShadowFade: "Weather Shadow Fade"
ShadowWeatherShadowFadeValue: "Weather Shadow Fade ({value, number, ::.00})"
ShadowWeatherShadowFadeTooltip: "Default: 1.00\nHow much of the sun's shadows Weather Shadows takes away in grey weather. 1.00 removes them all when overcast, in rain, storms and snow; 0.50 leaves faint shadows then, which suits sky shaders that still show a sun in overcast weather; 0 is as if Weather Shadows were off."
ShadowWeatherShadowFadeDesc: "How much grey weather fades the sun's shadows."
ShadowWeatherSoftening: "Weather Shadow Softening"
ShadowWeatherSofteningValue: "Weather Shadow Softening ({value, number, ::.00})"
ShadowWeatherSofteningTooltip: "Default: 1.00\nWith Weather Shadows and Soft Shadows on, shadow edges soften with the weather's haze: crisp under a clear sky, half as soft again when cloudy, and up to twice as wide in fog and grey weather, as the sun's light scatters through the cloud. 0 keeps them crisp in every weather."
ShadowWeatherSofteningDesc: "Softer shadow edges in cloudy and hazy weather."
ShadowEndBeforeNight: "Shadows End Before Night"
ShadowEndBeforeNightValue: "Shadows End Before Night ({value, number, ::.00} h)"
ShadowEndBeforeNightTooltip: "Default: 0.00\nWith Night Shadows off, how many hours before nightfall the sun's shadows end (fading out over the half hour before), and how long after sunrise they return. At dusk the sun is at its lowest and its shadows are long, faint and the costliest of the day, so ending them about an hour early (1.00) saves the most frames when they matter least."
ShadowEndBeforeNightDesc: "End sun shadows early at dusk, when they cost the most."
ShadowWeatherShadows: "Weather Shadows"
ShadowWeatherShadowsTooltip: "Outdoor shadows follow the weather: as strong as the sun shows through it, full when clear or cloudy, faint in fog, and none when overcast, in rain, storms, ash and snow. They fade as one weather turns into the next. Lightning casts hard shadows for the split second of its flash, by night too.\n\nNo shadows are drawn while none would show, which also saves their cost in bad weather."
ShadowNightShadowsTooltip: "Keep shadows at night, cast by the moonlight.\n\nWhen off, outdoor shadows fade out over the last half hour before night falls and back in over the first half hour after sunrise, and none are drawn at night. The night light comes in so low that every shadow stretches across the town, costing several milliseconds each frame and speckling the surfaces it grazes."
ShadowUpdateInterval: "Shadow Temporal Reuse"
ShadowUpdateIntervalTooltip: |-
    Reuse shadow maps across frames instead of recalculating every frame.
    Significantly improves CPU performance at the cost of slightly delayed shadow updates.
    Automatically disabled at very low FPS. Requires restart.
