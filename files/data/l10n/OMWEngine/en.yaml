LightsClusteredLighting: "Clustered Lighting"
LightingResetToDefaults: "Resets to default values, would you like to continue?"
Lights: "Lights"
LightRadiusMultiplier: "Light Reach"
LightRadiusMultiplierValue: "Light Reach ({value, number, ::.00})"
LightRadiusMultiplierTooltip: "Default: 1.75\nHow far the light of lamps, torches and candles travels before it stops (a multiplier of each light's radius).\n\nLarger values light more of the scene and cost more performance. Light Bounce spreads over this distance too."
LightRadiusMultiplierDesc: "How far each light's glow travels."
LightBrightnessDesc: "How strong lights are overall."
LightFalloffDesc: "High: tight bright pools. Low: even, spread-out light."
LightBounceDesc: "Soft glow around lights, as if reflected off walls."
LightHotspotSofteningDesc: "Stops walls right next to a light burning out to white."
LightHotspotSoftening: "Hotspot Softening"
LightOcclusion: "Walls Block Lights"
LightOcclusionTooltip: "Default: On\nA wall, floor or closed door between a lamp and an object stops the lamp lighting it, so light no longer shines through into the next room. Furniture and other small things don't block. Decided per object, not per pixel."
LightHotspotSofteningValue: "Hotspot Softening ({value, number, ::.00})"
LightHotspotSofteningTooltip: "Default: 0.00\nRight next to a lamp or candle its light climbs far past full strength (more so with Light Falloff above 1), so the wall behind a sconce burns out to white. This rounds off just that part: 0.50 keeps the brightest spot within about 1.25 times full strength. The rest of the light's reach is unchanged."
SunlightBrightnessDesc: "Strength of direct sun and moonlight outside."
LowSunBrightness: "Low Sun Brightness"
LowSunBrightnessValue: "Low Sun Brightness ({value, number, ::.00})"
LowSunBrightnessDesc: "Sunlight when the sun is low, as a fraction of midday."
LowSunBrightnessTooltip: "Default: 1.00\nHow strong the sunlight is just after sunrise and before nightfall, as a fraction of its strength at midday (13:00). In between it follows the sun's height: strongest when the sun is highest, fading as it sinks.\n\n1.00 keeps it the same all day. Try 0.60."
MoonlightBrightness: "Moonlight Brightness"
MoonlightBrightnessValue: "Moonlight Brightness ({value, number, ::.00})"
MoonlightBrightnessDesc: "Extra strength for moonlight, at night only."
MoonlightBrightnessTooltip: "Default: 1.00\nScales moonlight on top of Sunlight Brightness, at night only (fading in over the hour before nightfall and out after sunrise).\n\nNight light is so dim that walls and streets away from lamps go black. Raising this gives them shape from the moon, rather than lifting the whole scene the way ambient or gamma would. Try 2-4."
MoonlightFollowsMoonPhases: "Moonlight Follows Moon Phases"
MoonlightFollowsMoonPhasesTooltip: "Default: Off\nMoonlight is full strength when Masser or Secunda is full, and dims down to 40% when both are new."
ExteriorAmbientDesc: "How bright the shade is outside."
InteriorAmbientDesc: "A room's base light before any lamps."
HeldLightBrightnessDesc: "Strength of carried torches and lanterns."
HeldLightReachDesc: "How far carried torches light."
HeldLightSoftnessDesc: "Removes the glare right around the torch."
HeldLightBounceDesc: "Soft glow carried lights send onto the walls around you."
HeldLightFlickerDesc: "How much carried torches and lanterns waver like a flame."
LightsSectionLamps: "Lamps & Torches"
LightsSectionDaylight: "Daylight & Rooms"
LightsSectionCarried: "Carried Lights (yours and NPCs')"
LightsSectionAdvanced: "Advanced"
LightsSectionOutdoor: "Lamps Outside"
SeparateOutdoorLights: "Separate Settings Outside"
SeparateOutdoorLightsTooltip: "Default: Off\nLamps outside use the three sliders below in place of Light Reach, Light Brightness and Light Bounce above, so streets and interiors can each be tuned without switching back and forth. Switches as you go in and out. Falloff and Hotspot Softening are shared."
OutdoorLightReach: "Light Reach Outside"
OutdoorLightReachValue: "Light Reach Outside ({value, number, ::.00})"
OutdoorLightReachTooltip: "Default: 1.75\nLight Reach for lamps outside, while Separate Settings Outside is on."
OutdoorLightBrightness: "Light Brightness Outside"
OutdoorLightBrightnessValue: "Light Brightness Outside ({value, number, ::.00})"
OutdoorLightBrightnessTooltip: "Default: 1.00\nLight Brightness for lamps outside, while Separate Settings Outside is on."
OutdoorLightBounce: "Light Bounce Outside"
OutdoorLightBounceValue: "Light Bounce Outside ({value, number, ::.00})"
OutdoorLightBounceTooltip: "Default: 0.00\nLight Bounce for lamps outside, while Separate Settings Outside is on."
LightBrightness: "Light Brightness"
LightBrightnessValue: "Light Brightness ({value, number, ::.00})"
LightBrightnessTooltip: "Default: 1.00\nStrength of every point light: torches, lamps, candles and spells.\n\nRaise it if lamps look dim against the room around them, lower it if pools of light wash out."
LightFalloff: "Light Falloff"
LightFalloffValue: "Light Falloff ({value, number, ::.00})"
LightFalloffTooltip: "Default: 1.00\nHow quickly point lights dim with distance.\n\nAbove 1, lights are brighter close to the source and darker further away, for tighter pools of light with more contrast. Below 1, light spreads more evenly. Lights still end at the same radius."
LightBounce: "Light Bounce"
LightBounceValue: "Light Bounce ({value, number, ::.00})"
LightBounceTooltip: "Default: 0.00\nSoft light each lamp, torch or candle spreads around itself in its own colour, like light bouncing off the walls, floor and ceiling.\n\nIt reaches further than the light itself and wraps around objects, so lamps shape the room around them without raising its base light or gamma. 0.2-0.4 is subtle."
SunlightBrightness: "Sunlight Brightness"
SunlightBrightnessValue: "Sunlight Brightness ({value, number, ::.00})"
SunlightBrightnessTooltip: "Default: 1.00\nStrength of direct sunlight and moonlight outside.\n\nRaise it for brighter, more colourful sunlit surfaces. Together with a slightly lower Exterior Ambient, sunny days get more contrast without washing out."
ExteriorAmbient: "Exterior Ambient"
ExteriorAmbientValue: "Exterior Ambient ({value, number, ::.00})"
ExteriorAmbientTooltip: "Default: 1.00\nThe sky's even base light outside: how bright the shaded sides of things are.\n\nLower it for deeper shade and stronger sunlight contrast, raise it for a softer, flatter look."
InteriorAmbient: "Interior Ambient"
InteriorAmbientValue: "Interior Ambient ({value, number, ::.00})"
InteriorAmbientTooltip: "Default: 1.00\nBase light of interiors: the room's own ambient and directional light.\n\nLower it for darker rooms where lamps and torches stand out, raise it for brighter interiors. The darkest rooms are still kept at the minimum interior brightness (0.08 by default, in settings.cfg) unless classic falloff is used."
HeldLightBrightness: "Held Light Brightness"
HeldLightBrightnessValue: "Held Light Brightness ({value, number, ::.00})"
HeldLightBrightnessTooltip: "Default: 1.00\nStrength of the torches and lanterns characters carry: yours, guards' and everyone else's. Lights placed in the world are left alone.\n\nApplies on top of Light Brightness."
HeldLightReach: "Held Light Reach"
HeldLightReachValue: "Held Light Reach ({value, number, ::.00})"
HeldLightReachTooltip: "Default: 1.00\nHow far the torches and lanterns characters carry reach before they end. It stays as bright at a given distance, so a longer reach lights more of the room without brightening what is near you."
HeldLightSoftness: "Held Light Softness"
HeldLightSoftnessValue: "Held Light Softness ({value, number, ::.00})"
HeldLightBounce: "Held Light Bounce"
HeldLightBounceValue: "Held Light Bounce ({value, number, ::.00})"
HeldLightCarrierShadow: "Carrier Blocks Held Light"
HeldLightCarrierShadowTooltip: "Default: On\nThe body of whoever carries a torch or lantern blocks its direct light, so it no longer lights the floor and walls behind them as if they weren't there. The shadow's edge softens with distance, and Held Light Bounce still wraps softly around them.\n\nOnly with Clustered Lighting."
HeldLightFlicker: "Held Light Flicker"
HeldLightFlickerValue: "Held Light Flicker ({value, number, ::.00})"
HeldLightFlickerTooltip: "Default: 0.00\nCarried torches and lanterns waver like a flame: their glow dims and recovers unevenly, a slow sway under a quicker flutter, by up to 40% at 1.00. 0 keeps them steady.\n\nLights that already flicker or pulse keep their own."
HeldLightBounceTooltip: "Default: 0.00\nLight Bounce for the torches and lanterns characters carry: a soft glow in the light's colour on the walls, floor and ceiling around whoever carries one, as if bounced off them, so a torch lights up the room around you rather than just a pool in front of you.\n\nOnly with Clustered Lighting; otherwise carried lights use Light Bounce."
HeldLightSoftnessTooltip: "Default: 0.00\nEvens out the torches and lanterns characters carry: dims the hot spot on the hands, armour and ground right around whoever carries one, and brightens what is further away.\n\nThe light keeps the same brightness at about a third of its radius, so raise Held Light Brightness or lower it to taste afterwards."
LightsFadeStartMultiplier: "Fade Start Multiplier"
LightsFadeStartMultiplierValue: "Fade Start Multiplier ({value, number, ::.00})"
LightsFadeStartMultiplierTooltip: "Default: 0.85\nFraction of maximum distance at which lights will start to fade.\n\nSet this to a low value for slower transitions or a high value for quicker transitions."
LightsClusteredLightingTooltip:  |-
    Enable clustered lighting.
    Divides the screen into regions to assign lights, removing per-object light limits.

    Classic falloff and max light options do not apply in this mode.

    Enables point light specular highlights on the water plane when the water shader is enabled.

    It is highly recommended to use this with per-pixel lighting enabled, as vertex lighting can cause light pop at screen edges.
LightsMaximumDistance: "Maximum Light Distance"
LightsMaximumDistanceValue: "Maximum Light Distance ({value, number, :: group-off})"
LightsMaximumDistanceTooltip: "Default: 8192\nMaximum distance at which lights will appear (measured in units).\n\nSet this to 0 to use an unlimited distance."
LightsMinimumInteriorBrightness: "Minimum Interior Brightness"
LightsMinimumInteriorBrightnessValue: "Minimum Interior Brightness ({value, number, ::.00})"
LightsMinimumInteriorBrightnessTooltip: "Default: 0.08\nMinimum ambient interior brightness.\n\nIncrease this if you feel interiors are too dark.\n\nThis has no effect if classic falloff is used."
MatchSunlightToSun: "Match Sunlight to Sun"
MatchSunlightToSunTooltip: |-
    In Morrowind, the apparent sun position does not match its light direction due to mysterious reasons.
    We preserve this unrealistic behavior for compatibility.

    This option makes the sun light source's position match the sun's position.
MaxLights: "Max Lights"
MaxLightsValue: "Max Lights ({value, number, :: group-off})"
MaxLightsTooltip: "Default: 16\nMaximum number of lights per object.\n\nA low number near default will cause light popping similar to what you would see in Morrowind."
MenuHelpDelay: "Menu Help Delay"
MgeFogFull: "MGE XE"
MgeFogThin: "Clear"
MgeStormFogValue: "Storm Fog ({value, number, percent})"
MgeStormFogTooltip: |-
    How thick ash, blight and blizzard storms are.
    100% is MGE XE's storm fog (you see about one cell in a blight storm), 0% is as clear as Clear weather.
MgeWeatherFogValue: "Weather Fog ({value, number, percent})"
MgeWeatherFogTooltip: |-
    How thick the fog is in every other weather: Foggy, Overcast, Rain, Thunderstorm, Snow and Cloudy.
    100% is MGE XE's weather fog, 0% is as clear as Clear weather.
MgeFogStartValue: "Fog Start ({value, plural, one {# cell} other {# cells}})"
MgeFogStartTooltip: |-
    Where the haze begins in clear weather, in cells (1 cell is about 115 m). Every other weather pulls it closer.

    MGE XE's default is 2. Changes apply immediately.
MgeFogEndValue: "Fog End ({value, plural, one {# cell} other {# cells}})"
MgeFogEndTooltip: |-
    Where the world disappears into the fog in clear weather. Every other weather pulls it closer.

    MGE XE's default is 5. Keep it close to your View Distance: lower and the game draws land you can't see, higher and the edge of the world shows.
MgeSunHazeValue: "Sun Haze ({value, number, percent})"
MgeSunHazeTooltip: |-
    The haze toward the sun takes the sun's own colour: golden at sunrise and sunset, near white at noon, and a little brighter. Clear and Cloudy weather.

    0% keeps MGE XE's white glow.
MgeFogFollowsViewDistance: "Fog Follows View Distance"
MgeFogFollowsViewDistanceTooltip: |-
    The fog ends at your View Distance instead of at Fog End, so the edge of the world never shows and the game draws no land the fog hides.

    Fog Start moves with it and keeps its share of the way: with Start 2 and End 5 the haze begins two fifths of the way out, wherever your View Distance is.
WaveHeightValue: "Wave Height ({value, plural, =0 {off} other {#}})"
WaveHeightTooltip: |-
  OpenMGE XE 3D water: real waves on the water near you, height in game units in the windiest weather (calm weather has about a third of it, rain about two thirds).

  0 = flat water. 20-40 looks natural; high values make docks and boats clip through the crests. Needs shader water.
ReflectionUpdateIntervalValue: "Reflection Updates (every {value, plural, =1 {frame} other {# frames}})"
ReflectionUpdateIntervalTooltip: |-
  Draw the water reflection only every this many frames and reuse it in between. Saves drawing the scene a second time near water; reflections can trail slightly when turning fast.

  Below about 25 frames per second the reflection is drawn every frame anyway.
ReflectionStaticsDistanceValue: "Buildings in Reflections ({cells, plural, =0 {all} other {within # cells}})"
ReflectionStaticsDistanceTooltip: |-
  Leave distant buildings and other statics beyond this distance out of the water reflection; terrain and sky are still reflected. Cheaper reflections near water (Vivec, Ebonheart).

  Takes effect after restarting the game.
LuaDistantUpdateValue: "Distant Script Updates (every {value, plural, =1 {frame} other {# frames}})"
LuaDistantUpdateTooltip: |-
  Scripted objects more than about 44 m from you run their mods' per-frame updates only every this many frames (with the full elapsed time). Cuts the cost of Lua mods in busy towns.

  Nearby objects, actors in combat and you always update every frame. Animations or effects that mods drive on distant NPCs can get choppier.
