# Shadow settings

Shadows: "Shadows"
ActorShadows: "Enable Actor Shadows"
ActorShadowsTooltip: "Enable shadows for NPCs and creatures besides the player character. May have a minor performance impact."
PlayerShadows: "Enable Player Shadows"
PlayerShadowsTooltip: "Enable shadows exclusively for the player character. May have a very minor performance impact."
TerrainShadows: "Enable Terrain Shadows"
TerrainShadowsTooltip: "Enable shadows for the terrain including distant terrain. May have a significant performance and shadow quality impact."
ObjectShadows: "Enable Object Shadows"
ObjectShadowsTooltip: "Enable shadows for primarily inanimate objects. May have a significant performance impact."
IndoorShadows: "Enable Indoor Shadows"
IndoorShadowsTooltip: "Due to limitations with Morrowind's data, only actors can cast shadows indoors, which some might feel is distracting. Has no effect if actor/player shadows are not enabled."
ShadowMapResolution: "Shadow Map Resolution"
ShadowMapResolutionTooltip: "The resolution of each individual shadow map. Increasing it significantly improves shadow quality but may have a minor performance impact."
ShadowsMaxDistanceValue: "Shadow Distance Limit ({value, number, :: group-off})"
ShadowsMaxDistanceTooltip: "The distance from the camera at which shadows completely disappear. Set to 0 to disable."
ShadowsMinCasterSizeValue: "Skip Tiny Shadows ({value, number, :: group-off} px)"
ShadowsMinCasterSizeTooltip: "Default: 3\nObjects smaller than this many pixels on screen do not cast shadows. Shadows are drawn several times per frame, so leaving out small or distant clutter saves a lot of work. 0 turns this off; higher values save more but small items like bottles and plants may lose their shadows."
ShadowsMinCasterSizeDesc: "Small, far objects skip casting shadows. Higher is faster."

